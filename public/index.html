<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>อากาศประเทศไทย</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  
</head>
<body>
  <div class="weather-scene" aria-hidden="true"><div class="sunlight"></div><div class="cloud cloud--one"></div><div class="cloud cloud--two"></div><div class="cloud cloud--tiny cloud--three"><span class="cloud-face"><i></i></span></div><div class="cloud cloud--tiny cloud--four"><span class="cloud-face"><i></i></span></div></div>
  <header><h1>อากาศประเทศไทย</h1><p>เช็กอุณหภูมิ ฝนที่กำลังจะมา และอุปกรณ์ที่ควรเตรียม</p><div class="header-weather-art" aria-hidden="true"><span class="header-weather-art__sun">🌞</span><span class="header-weather-art__cloud header-weather-art__cloud--back"></span><span class="header-weather-art__cloud header-weather-art__cloud--front"></span></div></header>
  <main>
    <form class="search" id="searchForm"><div class="province-field" id="province-field"><label for="province">พิมพ์หรือเลือกจังหวัด</label><div class="province-select-row"><input id="province" type="text" role="combobox" placeholder="เช่น เชียงใหม่" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="province-options" required><button type="button" id="favoriteButton" aria-pressed="false" title="เพิ่มจังหวัดที่เลือกในรายการโปรด">☆ Favorite</button></div><div class="province-suggestions" id="province-options" role="listbox" aria-label="จังหวัดที่แนะนำ" hidden></div></div><button type="button" id="searchButton">ดูสภาพอากาศ</button></form>
    <div id="error" role="alert"></div>
    <section class="grid">
      <div class="panel"><h2 id="locationName">เลือกจังหวัดเพื่อดูสภาพอากาศ</h2><div class="current"><div class="temperature" id="temperature">--°</div><div class="weather-summary" id="weatherSummary">พิมพ์หรือเลือกจังหวัดด้านบน</div></div><div class="stats"><div class="stat"><small>ความชื้น</small><strong id="humidity">--</strong></div><div class="stat"><small>ฝนตอนนี้</small><strong id="currentRain">--</strong></div><div class="stat"><small>ความเร็วลม</small><strong id="wind">--</strong></div><div class="stat"><small>อัปเดตเวลา</small><strong id="updatedAt">--</strong></div></div></div>
      <div class="panel rain"><h2>ฝนครั้งถัดไป</h2><div class="weather-doodle" aria-hidden="true"><span class="weather-doodle__sun"></span><span class="weather-doodle__puff"></span><div class="weather-doodle__cloud"><i class="weather-doodle__eye weather-doodle__eye--left"></i><i class="weather-doodle__eye weather-doodle__eye--right"></i><i class="weather-doodle__smile"></i></div><span class="weather-doodle__drop weather-doodle__drop--one"></span><span class="weather-doodle__drop weather-doodle__drop--two"></span><span class="weather-doodle__drop weather-doodle__drop--three"></span></div><p id="nextRain">เลือกจังหวัดเพื่อดูการพยากรณ์ฝน</p><p class="muted" id="rainProbability"></p></div>
    </section>
    <section class="panel panel-spaced"><h2>ควรเตรียมอะไรบ้าง</h2><ul class="advice" id="advice"></ul></section>
    <section class="panel panel-spaced"><h2>พยากรณ์ 2 วัน</h2><div class="forecast" id="forecast"></div></section>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
